        line-height: 1.8;

        font-weight: 800;

        border-radius: 8px;
        padding: 14px 15px;
        background: #fff;
        color: var(--ink);
        line-height: 1.7;

        gap: 8px;

        border: 1px solid transparent;

        border-color: var(--line);

      }

      .intensity-panel {

        padding: 0;
        border: 0;

        grid-template-columns: repeat(3, minmax(0, 1fr));

        margin-top: 10px;
        padding: 4px;

        background: #f1ece2;

        background: #fffdf8;
        color: var(--ink);
        box-shadow: 0 4px 14px rgba(31, 41, 51, 0.08);

        font-size: clamp(2rem, 5vw, 4.4rem);
        line-height: 1.08;

        margin: 0 0 26px;

        padding: 8px 0;
        color: #8a4f0f;

        color: #6a747b;
        font-size: 0.82rem;
        line-height: 1.5;

          grid-template-columns: 1fr;
        }

        .vision-card,

      @media (max-width: 560px) {
        .control-panel,

          padding: 12px;

        .topic-chips,

          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .segmented-control {
          grid-template-columns: 1fr;
        }

        .vision-card h2 {
          font-size: 2rem;
        }

        .card-content {
          padding: 22px;
        }
      }
    </style>

      function hashString(value) {
        let hash = 0;
        for (let index = 0; index < value.length; index += 1) {
          hash = (hash << 5) - hash + value.charCodeAt(index);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function pick(items, seed, offset) {
        return items[(seed + offset) % items.length];
      }

      function detectDomain(query) {
        if (selectedTopic) return selectedTopic;
        let best = ["general", 0];
        for (const [domain, keywords] of rules) {
          const score = keywords.reduce((total, keyword) => total + (query.includes(keyword) ? 1 : 0), 0);
          if (score > best[1]) best = [domain, score];
        }
        return best[1] > 0 ? best[0] : "general";
      }

      function summarizeIssue(query, domain) {
        const clean = query.replace(/[？?。！!，,]/g, "").trim();
        if (clean.length > 4) return clean.length > 22 ? `${clean.slice(0, 22)}...` : clean;
        const defaults = {
          transport: "台北交通與通勤壓力",
          urbanPlanning: "台北都市更新與生活圈重整",
          cityDiplomacy: "台北首都外交與國際定位",
          civilDefense: "台北災防民防與基礎設施安全",
          disinformation: "假訊息與社會信任防線",
          governance: "市府行政效率與制度改革",
          general: "台北市政的複雜挑戰"
        };
        return defaults[domain];
      }

      function generateCard() {
        const query = queryEl.value || "";
        const domain = detectDomain(query);
        const phrases = data[domain] || data.general;
        const seed = hashString(`${query}-${domain}-${intensity}-${reroll}`);
        const issue = summarizeIssue(query, domain);
        let body = `面對${issue}，${pick(phrases.openers, seed, 1)}${pick(phrases.frames, seed, 2)}${pick(phrases.solutions, seed, 3)}`;

        if (intensity === "campaign") {
          body += " 這不是口號，而是我對首都市民的具體承諾。";
        } else if (intensity === "strategic") {
          body += domain === "cityDiplomacy" || domain === "disinformation"
            ? " 台北必須站在民主防線的最前端，用制度把風險擋在城市之外。"
            : " 台北要做的，是把每個民生問題都提升成可驗證的系統改革。";
        }

        const card = {
          headline: pick(phrases.headlines, seed, 0),
          subtitle: pick(phrases.subtitles, seed, 4),
          body,
          tags: phrases.tags,
          disclaimer
        };

        headlineEl.textContent = card.headline;
        subtitleEl.textContent = card.subtitle;
        bodyEl.textContent = card.body;
        disclaimerEl.textContent = card.disclaimer;
        tagsEl.replaceChildren(...card.tags.map((tag) => {
          const span = document.createElement("span");
          span.textContent = tag;
          return span;
        }));
        return card;
      }

      function setActiveButtons(selector, activeValue, attribute) {
        document.querySelectorAll(selector).forEach((button) => {
          button.classList.toggle("active", button.dataset[attribute] === activeValue);
        });
      }

      function getCardText() {
        return [
          headlineEl.textContent,
          subtitleEl.textContent,
          "",
          bodyEl.textContent,
          "",
          [...tagsEl.querySelectorAll("span")].map((tag) => `#${tag.textContent}`).join(" "),
          disclaimerEl.textContent
        ].join("\n");
      }

      function copyText(text) {
        if (navigator.clipboard) {
          return navigator.clipboard.writeText(text);
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        return Promise.resolve();
      }

      function downloadSvg() {
        const lines = [
          "Taipei Vision Generator",
          headlineEl.textContent,
          subtitleEl.textContent,
          bodyEl.textContent,
          [...tagsEl.querySelectorAll("span")].map((tag) => `#${tag.textContent}`).join("  "),
          disclaimerEl.textContent
        ];
        const escaped = lines.map((line) => String(line).replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[char]));
        const bodyLines = [];
        const body = escaped[3] || "";
        for (let index = 0; index < body.length; index += 24) {
          bodyLines.push(body.slice(index, index + 24));
        }
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
          <rect width="1200" height="900" fill="#f7f4ed"/>
          <path d="M0 0h1200v900H0z" fill="#fffdf8" opacity=".88"/>
          <g stroke="#295f98" stroke-opacity=".12">${Array.from({ length: 38 }, (_, i) => `<path d="M${i * 32} 0v900"/>`).join("")}${Array.from({ length: 29 }, (_, i) => `<path d="M0 ${i * 32}h1200"/>`).join("")}</g>
          <rect x="70" y="70" width="6" height="28" fill="#b63243"/>
          <text x="92" y="94" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#295f98">${escaped[0]}</text>
          <text x="70" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="58" font-weight="900" fill="#16222a">${escaped[1]}</text>
          <text x="70" y="286" font-family="Microsoft JhengHei, sans-serif" font-size="30" font-weight="900" fill="#8a4f0f">${escaped[2]}</text>
          ${bodyLines.map((line, index) => `<text x="70" y="${370 + index * 48}" font-family="Microsoft JhengHei, sans-serif" font-size="30" font-weight="700" fill="#26343c">${line}</text>`).join("")}
          <text x="70" y="790" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#5a6872">${escaped[4]}</text>
          <text x="70" y="835" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#6a747b">${escaped[5]}</text>
        </svg>`;
        const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "taipei-vision-card.svg";
        link.click();
        URL.revokeObjectURL(url);
      }

      document.querySelectorAll("[data-topic]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedTopic = button.dataset.topic;
          queryEl.value = prompts[selectedTopic];
          reroll += 1;
          setActiveButtons(".chip", selectedTopic, "topic");
          generateCard();
        });
      });

      document.querySelectorAll("[data-intensity]").forEach((button) => {
        button.addEventListener("click", () => {
          intensity = button.dataset.intensity;
          setActiveButtons(".segment", intensity, "intensity");
          generateCard();
        });
      });

      document.getElementById("generate").addEventListener("click", () => {
        selectedTopic = "";
        reroll += 1;
        setActiveButtons(".chip", selectedTopic, "topic");
        generateCard();
      });
      document.getElementById("reroll").addEventListener("click", () => {
        reroll += 1;
        generateCard();
      });
      document.getElementById("copy").addEventListener("click", async () => {
        await copyText(getCardText());
        const button = document.getElementById("copy");
        button.textContent = "已複製";
        setTimeout(() => {
          button.textContent = "複製";
        }, 1400);
      });
      document.getElementById("download").addEventListener("click", downloadSvg);
      queryEl.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          selectedTopic = "";
          reroll += 1;
          setActiveButtons(".chip", selectedTopic, "topic");
          generateCard();
        }
      });

      generateCard();
    </script>
  </body>
</html>
